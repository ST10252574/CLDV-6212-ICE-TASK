# Local development stack:  docker compose up --build
#   Web app  -> http://localhost:3000
#   API      -> http://localhost:8080   (Swagger UI at /swagger)
# Compose is for LOCAL use. In production the frontend and backend are deployed as two
# separate containerised services and the database is a hosted free-tier Postgres (Neon).

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      stocksense:
        aliases:
          - db

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # "db" is the network alias of the Postgres container above.
      ConnectionStrings__Default: Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Jwt__Key: ${JWT_KEY}
      Cors__AllowedOrigins: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      SeedDemoData: ${SEED_DEMO_DATA:-true}
    ports:
      - "8080:8080"
    networks:
      stocksense:
        aliases:
          - api

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    environment:
      # nginx proxies /api/* to this address using the "api" network alias.
      BACKEND_URL: http://api:8080
      PORT: "8080"
    ports:
      - "3000:8080"
    networks:
      stocksense:
        aliases:
          - web

networks:
  stocksense:
    driver: bridge

volumes:
  pgdata:
